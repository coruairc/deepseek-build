# deepseek-build release pipeline.
#
# Trigger: pushing a `v*` tag builds the `release-dist` binary for 5 targets
# (each on a NATIVE runner — no cross-compilation, no qemu), packages four
# tarballs and one Windows .zip, then attaches them + SHA256SUMS + the
# repo-root install.sh/install.ps1 to a GitHub release for that tag.
# `workflow_dispatch` runs the same pipeline for manual testing; it creates NO
# release (release creation is tag-only).
#
# The targets are split across three jobs, `build-linux`, `build-macos` and
# `build-windows`, so a slow or failed macOS/Windows leg cannot erase the
# container image: `container` needs only `build-linux`, while `publish` waits
# for all three because its verify step names all four tarballs and the zip.
# Artifact names stay `release-<target>`.
#
# ══ HARD CONSTRAINT (stakeholder) — NO OTHER UPLOADS ═════════════════════════
# This workflow must not upload anything anywhere else. The ONLY upload paths
# allowed here are:
#   1. actions/upload-artifact — GitHub-internal artifact storage, used solely
#      to hand the tarballs from the build jobs to the publish job within this
#      same workflow run.
#   2. Any other upload destination (S3, codecov, external mirrors, non-GitHub
#      artifact stores) → NOT USED in this workflow.
#   3. The GitHub release itself (softprops/action-gh-release) for tarballs +
#      SHA256SUMS + install.sh.
#   4. docker/build-push-action → GHCR (container job only; separate from
#      tarball publish job). Only for linux/amd64 + linux/arm64 targets.
# No S3, no codecov, no telemetry, no external mirrors. If you find yourself
# adding another upload step: stop.
# ═════════════════════════════════════════════════════════════════════════════
#
# All third-party actions are pinned to full-length commit SHAs (floating tags
# are forbidden). Current pins (verified via `git ls-remote --tags`):
#   actions/checkout            v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/upload-artifact     v7.0.1  043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact   v8.0.1  3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   Swatinem/rust-cache         v2.9.2  6323deb102c322ba6fcbdcafc7e3dddab59af2b6
#   softprops/action-gh-release v3.0.3  efb35369e0ad2afab669f228072c1b0d510eae64
#   docker/setup-buildx-action  v3.12.0 8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
#   docker/login-action         v3.7.0  c94ce9fb468520275223c153574b00df6fe4bcc9
#   docker/metadata-action      v5.10.0 c299e40c65443455700f0fdfc63efafe5b349051
#   docker/build-push-action    v6.19.2 10e90e3645eae34f1e60eeb005ba3a3d33f178e8

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Least privilege: the workflow-scope token gets NO permissions; only the
# publish job elevates to `contents: write` (to create the GitHub release) and
# the container job needs `packages: write` (to push to GHCR).
permissions: {}

# Duplicate tag pushes queue instead of racing (cancel-in-progress: false so a
# queued rerun never kills a publish mid-flight).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap job: derive the release version string once for all builds.
  # Tag `v1.2.3` -> `1.2.3` (stamped via GROK_VERSION in the build step).
  # workflow_dispatch runs have no tag -> fall back to `0.0.0-<shortsha>`.
  version:
    name: Derive release version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.derive.outputs.version }}
      is_prerelease: ${{ steps.derive.outputs.is_prerelease }}
    steps:
      - name: Derive version from the pushed tag
        id: derive
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              v?*) version="${GITHUB_REF_NAME#v}" ;;
              *)
                echo "::error::release tags must match 'v*' (got '${GITHUB_REF_NAME}')"
                exit 1
                ;;
            esac
            # Strict semver gate: a non-semver tag (v0.1, v1, v0.1.0.0) must die
            # here, before any build or registry push, because
            # `type=ref,event=tag` would otherwise emit e.g. :v0.1 and move
            # :latest. Build metadata is rejected too — the pinned
            # metadata-action sanitizes `+` to `-`, so `v0.1.0+build.5` would
            # compare mismatched names after `publish` created a release.
            if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::release tag '${GITHUB_REF_NAME}' is not a semver tag (expected vX.Y.Z or vX.Y.Z-<pre>)"
              exit 1
            fi
          else
            version="0.0.0-${GITHUB_SHA:0:7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${version}"
          # A pre-release tag contains a hyphen: v1.2.3-rc1 -> is_prerelease=true
          if printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Two matrix jobs split by OS family (plus the single-leg `build-windows`
  # below) so `container` can depend on the Linux one alone; every leg runs on
  # a NATIVE runner for its target (no cross-compilation): linux gnu on
  # ubuntu-22.04 (older glibc base) and linux
  # arm64 on the free-for-public-repos native arm runner in `build-linux`; both
  # macOS targets on macOS 15 runners (macos-13 is retired; macos-15-intel still
  # exists and runs natively on Intel hardware) in `build-macos`. Artifact names
  # stay `release-<target>`, the contract `publish` and `container` download.
  # Budgets differ on purpose: every Linux leg gets 90 minutes, `build-macos`
  # gets 240. On `v0.0.1-rc4` (run 40111152104) the aarch64-apple-darwin leg hit
  # the 90-minute job timeout and cancelled the run before `publish` (and the
  # then-coupled `container`) could start. The macOS arm64 runner is a 3 vCPU /
  # 7 GB box (4 vCPU / 14 GB for macos-15-intel) while `release-dist` does thin
  # LTO with codegen-units = 1, so 90 minutes was never a plausible ceiling
  # there. If 240 is still not enough, the next lever is a macOS-only per-job
  # profile override: CARGO_PROFILE_RELEASE_DIST_LTO=off plus
  # CARGO_PROFILE_RELEASE_DIST_CODEGEN_UNITS=16 on `build-macos` only. Do not add
  # it speculatively — the Phase 4 tag run decides, and every Linux leg keeps its
  # LTO settings either way.
  build-linux:
    name: build-linux (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      # Tag ref -> HEAD is the tag commit, so `git rev-parse HEAD` in build.rs
      # stamps the commit correctly at the default shallow fetch-depth (1).
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # protoc is HARD-REQUIRED on GitHub Actions: crates/build/xai-proto-build
      # returns an error when GITHUB_ACTIONS is set and no protoc is found. The
      # repo's bin/protoc dotslash wrapper must NOT be used in CI (dotslash is
      # absent and it would try a network fetch), so we set the PROTOC env var
      # explicitly to the real protoc path — find_protoc checks $PROTOC first
      # and never reaches the wrapper walk-up.
      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler cmake
          # cmake: build prerequisite for aws-lc-sys (rustls) — usually
          # preinstalled on ubuntu-22.04, installed anyway (idempotent).
          protoc_path="$(command -v protoc)"
          if [ -z "${protoc_path}" ]; then
            echo "::error::protoc was not installed by apt"
            exit 1
          fi
          echo "PROTOC=${protoc_path}" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins 1.94.0 and rustup picks it up automatically on
      # the first cargo call inside the repo; install it explicitly up front
      # (minimal profile, no components — a release build runs no clippy/fmt) so
      # the version is deterministic instead of lazily resolved.
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94.0 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Per-target cache key so the 4 matrix legs never thrash one cache.
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      # GROK_VERSION stamps the release version into the binary (build.rs +
      # xai-grok-version); without it IS_DEV_BUILD=true and --version omits the
      # tag's version. jemalloc / ObjC link args in .cargo/config.toml apply
      # automatically per target. --locked turns a stale Cargo.lock into a red
      # job instead of a silent regenerate (03-02 regenerates the lock in this
      # same phase; no workflow runs until Phase 4).
      - name: Build release-dist binary
        run: cargo build --profile release-dist --locked -p xai-grok-pager-bin
        env:
          GROK_VERSION: ${{ needs.version.outputs.version }}

      # `deepseek-build <version> (<shortcommit>)` — both shape and stamped
      # version are asserted; a wrong stamp must fail the job here.
      - name: Smoke-check the built binary
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          out="$(target/release-dist/deepseek-build --version)"
          printf 'binary reports: %s\n' "${out}"
          if ! printf '%s\n' "${out}" | grep -Fq "deepseek-build ${RELEASE_VERSION} ("; then
            echo "::error::--version does not report the release version: wanted 'deepseek-build ${RELEASE_VERSION} (...)', got '${out}'"
            exit 1
          fi
          if ! printf '%s\n' "${out}" | grep -Eq '^deepseek-build [^ ]+ \([0-9a-f]{7,40}\)$'; then
            echo "::error::--version output has unexpected shape (name version (commit)): '${out}'"
            exit 1
          fi

      # Tarball with the binary + licenses at the TOP LEVEL (no nested dir), so
      # `tar xf` drops the binary directly. THIRD-PARTY-NOTICES ships because
      # vendored libgit2's GPL-2.0-with-linking-exception text lives there —
      # that is the license-safe choice for a public distribution.
      - name: Package tarball
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp target/release-dist/deepseek-build "$stage/deepseek-build"
          cp LICENSE NOTICE THIRD-PARTY-NOTICES "$stage/"
          cat > "$stage/README.txt" <<'EOF'
          deepseek-build
          ==============

          A terminal coding assistant for DeepSeek models (deepseek-v4-pro / deepseek-flash).

          This binary is an independent project, not affiliated with DeepSeek.

          It is built from source derived from xai-org/grok-build (Apache-2.0). The
          LICENSE, NOTICE, and THIRD-PARTY-NOTICES files in this archive carry the
          full license and attribution details, including the vendored libgit2
          license (GPL-2.0-with-linking-exception).

          Quick start:

              export DEEPSEEK_API_KEY=...       # or DEEPSEEK_BUILD_API_KEY=...
              ./deepseek-build

          Configuration, sessions, and logs live under ~/.deepseek-build. At runtime
          the binary only talks to api.deepseek.com over HTTPS.
          Source and docs: https://github.com/coruairc/deepseek-build
          EOF
          tar -czf "deepseek-build-${RELEASE_VERSION}-${RT}.tar.gz" -C "$stage" deepseek-build LICENSE NOTICE THIRD-PARTY-NOTICES README.txt
          printf '%s\n' "archive contents:"
          tar -tzf "deepseek-build-${RELEASE_VERSION}-${RT}.tar.gz"

      # GitHub-internal artifact transport only (see the hard constraint above).
      # The publish job downloads these and attaches them to the release.
      # The container job downloads linux-* tarballs to build Docker images.
      - name: Upload tarball as a job artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.target }}
          path: deepseek-build-*.tar.gz
          if-no-files-found: error

  build-macos:
    name: build-macos (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      # Tag ref -> HEAD is the tag commit, so `git rev-parse HEAD` in build.rs
      # stamps the commit correctly at the default shallow fetch-depth (1).
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # protoc is HARD-REQUIRED on GitHub Actions: crates/build/xai-proto-build
      # returns an error when GITHUB_ACTIONS is set and no protoc is found. The
      # repo's bin/protoc dotslash wrapper must NOT be used in CI (dotslash is
      # absent and it would try a network fetch), so we set the PROTOC env var
      # explicitly to the real protoc path — find_protoc checks $PROTOC first
      # and never reaches the wrapper walk-up.
      - name: Install system dependencies
        run: |
          set -euo pipefail
          # cmake is preinstalled on macOS runners (needed by aws-lc-sys).
          brew install protobuf
          protoc_path="$(command -v protoc)"
          if [ -z "${protoc_path}" ]; then
            echo "::error::protoc was not installed by brew"
            exit 1
          fi
          echo "PROTOC=${protoc_path}" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins 1.94.0 and rustup picks it up automatically on
      # the first cargo call inside the repo; install it explicitly up front
      # (minimal profile, no components — a release build runs no clippy/fmt) so
      # the version is deterministic instead of lazily resolved.
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal

      # Per-target cache key so the matrix legs never thrash one cache.
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      # GROK_VERSION stamps the release version into the binary (build.rs +
      # xai-grok-version); without it IS_DEV_BUILD=true and --version omits the
      # tag's version. jemalloc / ObjC link args in .cargo/config.toml apply
      # automatically per target. --locked turns a stale Cargo.lock into a red
      # job instead of a silent regenerate (03-02 regenerates the lock in this
      # same phase; no workflow runs until Phase 4).
      - name: Build release-dist binary
        run: cargo build --profile release-dist --locked -p xai-grok-pager-bin
        env:
          GROK_VERSION: ${{ needs.version.outputs.version }}

      # rustc ad-hoc signs arm64 Mach-O output by itself, but the Intel linker
      # emits an unsigned binary, and an unsigned artifact would fail the
      # --verify below for a non-defect. Sign explicitly on both arches after the
      # build and before packaging: the signature then covers the
      # link-time-stripped binary, and nothing writes to the file afterwards
      # (`tar` preserves bytes, which the extracted-artifact check proves).
      - name: Ad-hoc sign the macOS binary
        run: |
          set -euo pipefail
          codesign --force --sign - target/release-dist/deepseek-build
          codesign --verify --strict --verbose=2 target/release-dist/deepseek-build
          codesign -dv target/release-dist/deepseek-build 2>&1

      # `deepseek-build <version> (<shortcommit>)` — both shape and stamped
      # version are asserted; a wrong stamp must fail the job here.
      - name: Smoke-check the built binary
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          out="$(target/release-dist/deepseek-build --version)"
          printf 'binary reports: %s\n' "${out}"
          if ! printf '%s\n' "${out}" | grep -Fq "deepseek-build ${RELEASE_VERSION} ("; then
            echo "::error::--version does not report the release version: wanted 'deepseek-build ${RELEASE_VERSION} (...)', got '${out}'"
            exit 1
          fi
          if ! printf '%s\n' "${out}" | grep -Eq '^deepseek-build [^ ]+ \([0-9a-f]{7,40}\)$'; then
            echo "::error::--version output has unexpected shape (name version (commit)): '${out}'"
            exit 1
          fi

      # Tarball with the binary + licenses at the TOP LEVEL (no nested dir), so
      # `tar xf` drops the binary directly. THIRD-PARTY-NOTICES ships because
      # vendored libgit2's GPL-2.0-with-linking-exception text lives there —
      # that is the license-safe choice for a public distribution.
      - name: Package tarball
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp target/release-dist/deepseek-build "$stage/deepseek-build"
          cp LICENSE NOTICE THIRD-PARTY-NOTICES "$stage/"
          cat > "$stage/README.txt" <<'EOF'
          deepseek-build
          ==============

          A terminal coding assistant for DeepSeek models (deepseek-v4-pro / deepseek-flash).

          This binary is an independent project, not affiliated with DeepSeek.

          It is built from source derived from xai-org/grok-build (Apache-2.0). The
          LICENSE, NOTICE, and THIRD-PARTY-NOTICES files in this archive carry the
          full license and attribution details, including the vendored libgit2
          license (GPL-2.0-with-linking-exception).

          Quick start:

              export DEEPSEEK_API_KEY=...       # or DEEPSEEK_BUILD_API_KEY=...
              ./deepseek-build

          Configuration, sessions, and logs live under ~/.deepseek-build. At runtime
          the binary only talks to api.deepseek.com over HTTPS.
          Source and docs: https://github.com/coruairc/deepseek-build
          EOF
          tar -czf "deepseek-build-${RELEASE_VERSION}-${RT}.tar.gz" -C "$stage" deepseek-build LICENSE NOTICE THIRD-PARTY-NOTICES README.txt
          printf '%s\n' "archive contents:"
          tar -tzf "deepseek-build-${RELEASE_VERSION}-${RT}.tar.gz"

      # A user downloads the tarball, not `target/release-dist`, so verify the
      # packaged artifact: the signature must still validate after `tar`, the
      # extracted binary must report the stamped version (same needles as the
      # pre-tar smoke), and the archive must carry no `__DWARF` segment and no
      # `.dSYM` bundle. Runs before the upload, so a bad artifact never reaches
      # `publish`. `ARTIFACT_VERIFY_DIR` is declared here (and `RT` for the
      # tarball name) so the body is `set -u`-clean and the Linux fixture can
      # drive it with the same variable names.
      - name: Verify the packaged macOS artifact
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RT: ${{ matrix.target }}
          ARTIFACT_VERIFY_DIR: ${{ runner.temp }}/verify-packaged-artifact
        run: |
          set -euo pipefail
          rm -rf "${ARTIFACT_VERIFY_DIR}"
          mkdir -p "${ARTIFACT_VERIFY_DIR}"
          tar -xzf "deepseek-build-${RELEASE_VERSION}-${RT}.tar.gz" -C "${ARTIFACT_VERIFY_DIR}"
          bin="${ARTIFACT_VERIFY_DIR}/deepseek-build"
          # `tar` does not alter file bytes, so the signature applied after
          # linking is still valid on the extracted file. On arm64 the exec
          # below is the second test of that same fact: the kernel refuses to
          # run a binary whose signature no longer matches.
          codesign --verify --strict --verbose=2 "${bin}"
          if ! codesign -dv "${bin}" 2>&1 | grep -Eq 'Signature=(adhoc|Authority=)'; then
            echo "::error::extracted binary carries no signature (expected an ad-hoc or Developer ID signature)"
            exit 1
          fi
          out="$("${bin}" --version)"
          printf 'extracted binary reports: %s\n' "${out}"
          if ! printf '%s\n' "${out}" | grep -Fq "deepseek-build ${RELEASE_VERSION} ("; then
            echo "::error::extracted --version does not report the release version: wanted 'deepseek-build ${RELEASE_VERSION} (...)', got '${out}'"
            exit 1
          fi
          if ! printf '%s\n' "${out}" | grep -Eq '^deepseek-build [^ ]+ \([0-9a-f]{7,40}\)$'; then
            echo "::error::extracted --version output has unexpected shape (name version (commit)): '${out}'"
            exit 1
          fi
          if otool -l "${bin}" | grep -q '__DWARF'; then
            echo "::error::extracted binary still carries a __DWARF segment; release-dist must ship no DWARF"
            exit 1
          fi
          if [ -n "$(find . -name '*.dSYM' -print -quit)" ]; then
            echo "::error::a .dSYM bundle exists under the build tree; split-debuginfo must stay \"off\""
            exit 1
          fi

      # GitHub-internal artifact transport only (see the hard constraint above).
      # The publish job downloads these and attaches them to the release.
      # The container job downloads linux-* tarballs to build Docker images.
      - name: Upload tarball as a job artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.target }}
          path: deepseek-build-*.tar.gz
          if-no-files-found: error

  # Windows leg: a native windows-latest runner builds x86_64-pc-windows-msvc
  # and packages a .zip whose top level matches the tarballs (binary + the
  # license files). protoc must be installed explicitly: the repo's bin/protoc
  # is a dotslash shell wrapper, not a PE, and xai-proto-build fails in CI
  # without a real protoc on PATH. Rust 1.94.0 is the pinned toolchain
  # (rust-toolchain.toml); rustup is preinstalled on windows-latest.
  build-windows:
    name: build-windows (x86_64-pc-windows-msvc)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Tag ref -> HEAD is the tag commit, so `git rev-parse HEAD` in build.rs
      # stamps the commit correctly at the default shallow fetch-depth (1).
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # protoc is HARD-REQUIRED on GitHub Actions: crates/build/xai-proto-build
      # returns an error when GITHUB_ACTIONS is set and no protoc is found.
      # Chocolatey's shim may not be on PATH in this same step, so fall back to
      # its install location; find_protoc checks $PROTOC first and never
      # reaches the repo's dotslash wrapper.
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          choco install protoc -y --no-progress
          protoc_path="$(command -v protoc || true)"
          if [ -z "${protoc_path}" ]; then
            protoc_path="/c/ProgramData/chocolatey/bin/protoc.exe"
          fi
          if [ ! -x "${protoc_path}" ]; then
            echo "::error::protoc was not installed by chocolatey"
            exit 1
          fi
          "${protoc_path}" --version
          # find_protoc does PathBuf::try_exists on PROTOC, so it must be a WINDOWS path:
          # a Git-Bash "/c/..." form resolves to C:\c\... and the override is silently skipped.
          protoc_win="$(cygpath -w "${protoc_path}")"
          echo "PROTOC=${protoc_win}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      # Per-target cache key so this leg never thrashes the Unix caches.
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: x86_64-pc-windows-msvc
          cache-on-failure: true

      # GROK_VERSION stamps the release version into the binary (build.rs +
      # xai-grok-version); --locked turns a stale Cargo.lock into a red job
      # instead of a silent regenerate.
      - name: Build release-dist binary
        shell: bash
        run: cargo build --profile release-dist --locked -p xai-grok-pager-bin
        env:
          GROK_VERSION: ${{ needs.version.outputs.version }}

      # `deepseek-build <version> (<shortcommit>)` — strip the CR so the
      # end-anchored shape check matches Windows line endings.
      - name: Smoke-check the built binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          out="$(target/release-dist/deepseek-build.exe --version | tr -d '\r')"
          printf 'binary reports: %s\n' "${out}"
          if ! printf '%s\n' "${out}" | grep -Fq "deepseek-build ${RELEASE_VERSION} ("; then
            echo "::error::--version does not report the release version: wanted 'deepseek-build ${RELEASE_VERSION} (...)', got '${out}'"
            exit 1
          fi
          if ! printf '%s\n' "${out}" | grep -Eq '^deepseek-build [^ ]+ \([0-9a-f]{7,40}\)$'; then
            echo "::error::--version output has unexpected shape (name version (commit)): '${out}'"
            exit 1
          fi

      # Stage the zip's top level exactly like the tarballs: no nested
      # directory, binary + licenses + README. THIRD-PARTY-NOTICES ships
      # because vendored libgit2's GPL-2.0-with-linking-exception text lives
      # there.
      - name: Stage zip contents
        shell: bash
        run: |
          set -euo pipefail
          stage="stage-zip"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp target/release-dist/deepseek-build.exe "$stage/"
          cp LICENSE NOTICE THIRD-PARTY-NOTICES "$stage/"
          cat > "$stage/README.txt" <<'EOF'
          deepseek-build
          ==============

          A terminal coding assistant for DeepSeek models (deepseek-v4-pro / deepseek-flash).

          This binary is an independent project, not affiliated with DeepSeek.

          It is built from source derived from xai-org/grok-build (Apache-2.0). The
          LICENSE, NOTICE, and THIRD-PARTY-NOTICES files in this archive carry the
          full license and attribution details, including the vendored libgit2
          license (GPL-2.0-with-linking-exception).

          Quick start (PowerShell):

              $env:DEEPSEEK_API_KEY = '...'    # or DEEPSEEK_BUILD_API_KEY
              .\deepseek-build.exe

          Configuration, sessions, and logs live under %USERPROFILE%\.deepseek-build.
          At runtime the binary only talks to api.deepseek.com over HTTPS.
          Source and docs: https://github.com/coruairc/deepseek-build
          EOF
          ls -la "$stage"

      - name: Package zip
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "deepseek-build-${env:RELEASE_VERSION}-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path 'stage-zip/*' -DestinationPath $zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Resolve-Path -LiteralPath $zip).Path
          $entries = [System.IO.Compression.ZipFile]::OpenRead($zipPath).Entries.FullName
          $entries | ForEach-Object { Write-Host "archive entry: $_" }
          foreach ($name in @('deepseek-build.exe', 'LICENSE', 'NOTICE', 'THIRD-PARTY-NOTICES', 'README.txt')) {
            if ($entries -notcontains $name) {
              Write-Error "zip is missing the top-level entry $name"
              exit 1
            }
          }

      # GitHub-internal artifact transport only (see the hard constraint above).
      - name: Upload zip as a job artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-x86_64-pc-windows-msvc
          path: deepseek-build-*.zip
          if-no-files-found: error

  # Publish job: runs on ubuntu-22.04 (pinned, not ubuntu-latest, for
  # consistency with the build matrix; it only hashes and re-uploads files, so
  # the base image age is irrelevant). Needs the least privilege that exists:
  # contents: write to create the release, nothing else.
  publish:
    name: Publish GitHub release
    needs: [version, build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # Merge all 5 release-* artifacts into one flat directory.
      - name: Fetch packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify all four tarballs and the Windows zip arrived
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            file="dist/deepseek-build-${RELEASE_VERSION}-${t}.tar.gz"
            if [ ! -f "${file}" ]; then
              echo "::error::missing tarball: ${file}"
              ls -la dist || true
              exit 1
            fi
          done
          zip="dist/deepseek-build-${RELEASE_VERSION}-x86_64-pc-windows-msvc.zip"
          if [ ! -f "${zip}" ]; then
            echo "::error::missing Windows zip: ${zip}"
            ls -la dist || true
            exit 1
          fi

      - name: Guard — repo-root installers must exist to be published
        run: |
          set -euo pipefail
          for installer in install.sh install.ps1; do
            if [ ! -f "${installer}" ]; then
              echo "::error::${installer} is missing at the repo root; it must be published as a release asset"
              exit 1
            fi
          done

      # Bare filenames in SHA256SUMS (no path prefix), matching the tarball
      # and zip names as published on the release.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum deepseek-build-*.tar.gz deepseek-build-*.zip > SHA256SUMS
          cat SHA256SUMS

      # The release is only created for tag runs (workflow_dispatch is for
      # pipeline testing: it builds + uploads internal artifacts but skips this
      # step). Pass `prerelease` explicitly from the derived version: a tag with
      # a hyphen suffix (v1.2.3-rc1) must be marked prerelease so it never
      # becomes the repo's "Latest release". The pinned action does NOT infer
      # this from the tag name (softprops/action-gh-release @ v3.0.3 defaults
      # `prerelease: false`). This is the only external upload: the GitHub
      # release for the tag.
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ needs.version.outputs.is_prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/SHA256SUMS
            dist/deepseek-build-*.tar.gz
            dist/deepseek-build-*.zip
            install.sh
            install.ps1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Container job: builds and pushes a multi-arch OCI image to GHCR.io for
  # linux/amd64 + linux/arm64 from the release tarballs produced by the build
  # jobs. Runs only for tag pushes. `packages: write` is scoped to this job.
  #
  # Auth: GITHUB_TOKEN is auto-provisioned by GitHub Actions; docker/login-action
  # converts it to a GHCR token. packages: write is required to push images.
  # The image namespace is the REPOSITORY OWNER (github.repository_owner), not
  # github.actor: the latter is whoever pushed the tag and would point at the
  # wrong (or a non-existent) GHCR namespace when a collaborator pushes a tag.
  container:
    name: Build and push container image
    needs: [version, build-linux]
    runs-on: ubuntu-22.04
    if: github.ref_type == 'tag'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Fetch linux/amd64 tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-x86_64-unknown-linux-gnu
          path: dist/linux-amd64

      - name: Fetch linux/arm64 tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-aarch64-unknown-linux-gnu
          path: dist/linux-arm64

      - name: Stage per-arch build contexts
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for pair in "amd64:x86_64-unknown-linux-gnu" "arm64:aarch64-unknown-linux-gnu"; do
            arch="${pair%%:*}"; target="${pair##*:}"
            ctx="dist/ctx-${arch}"
            mkdir -p "$ctx"
            tar -xzf "dist/linux-${arch}/deepseek-build-${RELEASE_VERSION}-${target}.tar.gz" -C "$ctx"
            # The Dockerfile expects the binary named per TARGETARCH.
            mv "$ctx/deepseek-build" "$ctx/deepseek-build-${arch}"
            cp docker/Dockerfile "$ctx/Dockerfile"
            ls -la "$ctx"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository_owner }}/deepseek-build
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag

      # The metadata-action tag list is what both push steps below publish —
      # including `:latest` for a stable tag — so it is guarded BEFORE the first
      # push; a guard after them would be too late. The step prints the resolved
      # names (the release evidence quotes them) and fails loudly on an empty
      # list, a prerelease `latest`, a missing stable alias, or a name outside
      # the allowed set.
      - name: Guard the resolved image tag list
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/deepseek-build
          TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          IS_PRERELEASE: ${{ needs.version.outputs.is_prerelease }}
        run: scripts/guard-image-tags.sh

      # Build each arch natively (no QEMU) and push by digest, then assemble the
      # multi-arch manifest. `file: Dockerfile` is the copy staged per context.
      - name: Build and push linux/amd64
        id: build_amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: dist/ctx-amd64
          file: dist/ctx-amd64/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Build and push linux/arm64
        id: build_arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: dist/ctx-arm64
          file: dist/ctx-arm64/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Assemble multi-arch manifest
        env:
          IS_PRERELEASE: ${{ needs.version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/deepseek-build"
          AMD64="${{ steps.build_amd64.outputs.digest }}"
          ARM64="${{ steps.build_arm64.outputs.digest }}"
          echo "amd64=${AMD64} arm64=${ARM64}"
          # Create the manifest list for every tag metadata-action produced.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" \
              "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          done <<< "${{ steps.meta.outputs.tags }}"
          # Stable releases move :latest; pre-releases never do.
          if [ "${IS_PRERELEASE}" = "false" ]; then
            docker buildx imagetools create -t "${IMAGE}:latest" \
              "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          else
            echo "Pre-release — :latest unchanged"
          fi
          docker buildx imagetools inspect "${IMAGE}:${{ needs.version.outputs.version }}"
