# cargo-deny configuration for deepseek-build (Apache-2.0 first-party code).
# Tool: cargo-deny 0.20.2. Schema: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check all 4 release targets so licenses are validated for the full tree,
# not just the host platform. Dev-dependencies are included: they ship in
# CI/test images and should be audited too.
all-features = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# ----------------------------------------------------------------------------
# Licenses: the primary policy. First-party code is Apache-2.0; we allow the
# standard permissive set plus weak copyleft (MPL-2.0) and the special
# Unicode/ICU licenses. Strong copyleft is deliberately NOT allowed: any hit
# stays failing and is documented as a finding in docs/LICENSE-AUDIT.md.
# ----------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    # Standard permissive set.
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    # Weak copyleft: file-level copyleft, notice + source obligations only.
    "MPL-2.0",
    # Permissive CDLA for webpki-roots (bundled root CA cert data, not code).
    "CDLA-Permissive-2.0",
    # Unlicense: public-domain-style dedication (rust-lang crates ecosystem).
    "Unlicense",
    # fiat-crypto (RustCrypto elliptic-curve internals), one clause variant.
    "BSD-1-Clause",
]
# NOTE on libgit2: the stakeholder wants GPL-2.0-only WITH
# libgit2-linking-exception reflected in this policy. cargo-deny 0.20.2 does
# not have that exception term in its embedded SPDX list (config parsing
# rejects it), and libgit2-sys 0.18.2 itself declares "MIT OR Apache-2.0" in
# its manifest — the GPL-2.0-only term applies to the *vendored C libgit2*
# sources inside the crate. That case is covered by libgit2's linking
# exception (which permits distribution of combined non-GPL works) and is
# fully documented in THIRD-PARTY-NOTICES Part II and docs/LICENSE-AUDIT.md
# instead. It does NOT add a cargo-deny exception here because none is needed.

[advisories]
# License-focused run only: never block, just surface findings.
version = 2
yanked = "warn"
# 0.20 note: unmaintained/unlicensed severity lives under the 'lints' table;
# the standalone 'vulnerability' key was removed in 0.20 (embark#611).

[bans]
# This ~1246-crate workspace has dependency dupes; warn, don't fail.
multiple-versions = "warn"
# Dependencies specified with a bare wildcard version ("1.*") are forbidden
# in principle (supply-chain hygiene). NOTE: cargo-deny 0.20 also treats
# first-party { workspace = true } / path-only deps (no version requirement)
# as wildcards, so "deny" would fail on ~100 in-tree workspace members, which
# cannot be fixed without rewriting their Cargo.toml files. Kept at "warn":
# every wildcard hit is a first-party xai-*/in-tree crate (verified in the
# report); no third-party registry crate uses a bare wildcard version.
wildcards = "warn"
highlight = "all"

[sources]
# Allow crates.io and exactly one git patch source (our async-openai fork).
# Anything else fails with unknown-git/unknown-registry = deny.
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/our-forks/async-openai.git",
    # nucleo is pinned via git rev in [patch.crates-io] (from upstream).
    "https://github.com/helix-editor/nucleo.git",
]